
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow border-0">
                    <div class="card-body p-4 p-md-5">

                        <h1 class="text-center text-primary mb-2">
                            Đăng Ký Tài Khoản
                        </h1>

                        <p class="text-center text-muted mb-4">
                            Vui lòng điền đầy đủ thông tin bên dưới
                        </p>

                        <!-- Form đăng ký -->
                        <form id="registerForm">

                            <!-- Họ và tên -->
                            <div class="mb-3">
                                <label for="fullname" class="form-label">
                                    Họ và tên
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="fullname"
                                       name="fullname"
                                       placeholder="Nhập họ và tên"
                                       required>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email
                                </label>
                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       name="email"
                                       placeholder="example@gmail.com"
                                       required>
                            </div>

                            <!-- Mật khẩu -->
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Mật khẩu
                                </label>
                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       name="password"
                                       placeholder="Nhập mật khẩu"
                                       minlength="8"
                                       required>
                                <div class="form-text">
                                    Mật khẩu cần có ít nhất 8 ký tự.
                                </div>
                            </div>

                            <!-- Xác nhận mật khẩu -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">
                                    Xác nhận mật khẩu
                                </label>
                                <input type="password"
                                       class="form-control"
                                       id="confirmPassword"
                                       name="confirmPassword"
                                       placeholder="Nhập lại mật khẩu"
                                       minlength="8"
                                       required>
                            </div>

                            <!-- Giới tính -->
                            <fieldset class="mb-3">
                                <legend class="form-label fs-6">
                                    Giới tính
                                </legend>

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input"
                                           type="radio"
                                           name="gender"
                                           id="male"
                                           value="Nam"
                                           required>
                                    <label class="form-check-label" for="male">
                                        Nam
                                    </label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input"
                                           type="radio"
                                           name="gender"
                                           id="female"
                                           value="Nữ">
                                    <label class="form-check-label" for="female">
                                        Nữ
                                    </label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input"
                                           type="radio"
                                           name="gender"
                                           id="other"
                                           value="Khác">
                                    <label class="form-check-label" for="other">
                                        Khác
                                    </label>
                                </div>
                            </fieldset>

                            <!-- Sở thích -->
                            <fieldset class="mb-3">
                                <legend class="form-label fs-6">
                                    Sở thích
                                </legend>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           name="hobbies"
                                           id="reading"
                                           value="Đọc sách">
                                    <label class="form-check-label" for="reading">
                                        Đọc sách
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           name="hobbies"
                                           id="music"
                                           value="Nghe nhạc">
                                    <label class="form-check-label" for="music">
                                        Nghe nhạc
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           name="hobbies"
                                           id="travel"
                                           value="Du lịch">
                                    <label class="form-check-label" for="travel">
                                        Du lịch
                                    </label>
                                </div>
                            </fieldset>

                            <!-- Quốc gia -->
                            <div class="mb-4">
                                <label for="country" class="form-label">
                                    Quốc gia
                                </label>

                                <select class="form-select"
                                        id="country"
                                        name="country"
                                        required>
                                    <option value="" selected disabled>
                                        -- Chọn quốc gia --
                                    </option>
                                    <option value="Việt Nam">Việt Nam</option>
                                    <option value="Thái Lan">Thái Lan</option>
                                    <option value="Nhật Bản">Nhật Bản</option>
                                    <option value="Hàn Quốc">Hàn Quốc</option>
                                    <option value="Hoa Kỳ">Hoa Kỳ</option>
                                </select>
                            </div>

                            <!-- Nút Submit -->
                            <button type="submit"
                                    class="btn btn-primary w-100">
                                Đăng Ký
                            </button>

                            <p class="text-center text-muted small mt-3 mb-0">
                                Thông tin được nhập để thực hành biểu mẫu.
                            </p>

                            <div id="message" class="mt-3" aria-live="polite"></div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Kiểm tra dữ liệu form bằng JavaScript -->
    <script>
        const form = document.getElementById("registerForm");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        const message = document.getElementById("message");

        function checkPassword() {
            if (confirmPassword.value !== password.value) {
                confirmPassword.setCustomValidity("Mật khẩu xác nhận không khớp.");
            } else {
                confirmPassword.setCustomValidity("");
            }
        }

        password.addEventListener("input", checkPassword);
        confirmPassword.addEventListener("input", checkPassword);

        form.addEventListener("submit", function(event) {
            event.preventDefault();
            checkPassword();

            if (!form.reportValidity()) {
                return;
            }

            message.className = "alert alert-success mt-3";
            message.textContent =
                "Biểu mẫu hợp lệ! Đây là bài thực hành, dữ liệu chưa được lưu vào máy chủ.";
        });
    </script>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
